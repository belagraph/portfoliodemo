backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/portfolio   # change this
  branch: main
  base_url: https://YOUR-SITE.vercel.app # change this (no trailing slash)
  auth_endpoint: api/auth

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Portfolio
    files:
      - name: content
        label: Site content
        file: content/site.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: text }
          - { label: About (blank line = new paragraph), name: about, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - label: Work sections
            name: sections
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - label: Images
                name: images
                widget: list
                required: false
                field: { label: Image, name: image, widget: image }
